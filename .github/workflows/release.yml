name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  build:
    needs: lint
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: ppk2-linux-x86_64
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: ppk2-linux-arm64
            ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            name: ppk2-darwin-x86_64
            ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            name: ppk2-darwin-arm64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: ppk2-windows-x86_64
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: install deps (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package and release
        shell: bash
        run: |
          BIN=ppk2
          if [ "${{ runner.os }}" = "Windows" ]; then BIN=ppk2.exe; fi
          cd target/${{ matrix.target }}/release
          strip "$BIN" 2>/dev/null || true
          FILE="${{ matrix.name }}.${{ matrix.ext }}"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            "/c/Program Files/7-Zip/7z.exe" a "../../../$FILE" "$BIN"
          else
            tar -czf "../../../$FILE" "$BIN"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.name }}.${{ matrix.ext }}
          generate_release_notes: true
