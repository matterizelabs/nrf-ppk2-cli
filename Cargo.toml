[package]
name = "ppk2"
version = "0.1.4"
edition = "2021"
description = "CLI for Nordic Power Profiler Kit II"
license = "MIT"

[[bin]]
name = "ppk2"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
serialport = "4.7"
clap = { version = "4.5", features = ["derive"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
ctrlc = "3.5"
